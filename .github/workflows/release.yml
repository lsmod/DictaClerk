name: Release Pipeline

on:
  push:
    tags:
      - 'v*.*.*' # Triggers on version tags like v1.2.3

env:
  RUST_VERSION: '1.87.0'
  NODE_VERSION: '20.19.2'
  PNPM_VERSION: '9.0.0'

jobs:
  build-and-release:
    name: Build and Release Signed AppImage
    runs-on: ubuntu-latest
    permissions:
      contents: write # Required for creating releases

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Extract version from tag
        id: version
        run: |
          TAG=${GITHUB_REF#refs/tags/}
          VERSION=${TAG#v}
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Release version: $VERSION"

      - name: Setup Rust ${{ env.RUST_VERSION }}
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_VERSION }}

      - name: Cache Rust dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            src-tauri/target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Setup pnpm ${{ env.PNPM_VERSION }}
        uses: pnpm/action-setup@v3
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Cache pnpm dependencies
        uses: actions/cache@v4
        with:
          path: ~/.pnpm-store
          key: ${{ runner.os }}-pnpm-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-

      - name: Install system dependencies for Tauri and GPG signing
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            cmake \
            pkg-config \
            libogg-dev \
            libvorbis-dev \
            libopus-dev \
            libasound2-dev \
            gnupg2 \
            squashfs-tools

      - name: Install JavaScript dependencies
        run: pnpm install --frozen-lockfile

      - name: Build application
        run: pnpm tauri build --target x86_64-unknown-linux-gnu

      - name: Setup GPG for signing
        id: gpg
        run: |
          echo "${{ secrets.GPG_PRIVATE_KEY }}" | base64 -d > private.key
          gpg --batch --import private.key
          rm private.key

          # Get the key ID from the imported key
          KEY_ID=$(gpg --list-secret-keys --keyid-format LONG | grep sec | awk '{print $2}' | cut -d/ -f2)
          echo "key_id=$KEY_ID" >> $GITHUB_OUTPUT
          echo "GPG key imported: $KEY_ID"

      - name: Find and prepare packages
        id: packages
        run: |
          # Find the built packages - search in multiple possible locations
          APPIMAGE_PATH=$(find src-tauri/target/ /tmp/rust-builds/ -name "*.AppImage" 2>/dev/null | head -1)
          DEB_PATH=$(find src-tauri/target/ /tmp/rust-builds/ -name "*.deb" 2>/dev/null | head -1)
          RPM_PATH=$(find src-tauri/target/ /tmp/rust-builds/ -name "*.rpm" 2>/dev/null | head -1)

          if [ -z "$APPIMAGE_PATH" ]; then
            echo "Error: No AppImage found!"
            echo "Searched in:"
            echo "  - src-tauri/target/"
            echo "  - /tmp/rust-builds/"
            echo "Available files in potential locations:"
            find src-tauri/target/ /tmp/rust-builds/ -name "*AppImage*" 2>/dev/null || echo "  No AppImage files found"
            exit 1
          fi

          echo "Found packages:"
          echo "  AppImage: $APPIMAGE_PATH"
          echo "  DEB: $DEB_PATH"
          echo "  RPM: $RPM_PATH"

          # Create standardized names and copy packages
          APPIMAGE_STANDARDIZED="./dictaclerk.appimage"
          cp "$APPIMAGE_PATH" "$APPIMAGE_STANDARDIZED"
          chmod +x "$APPIMAGE_STANDARDIZED"

          # Copy DEB package if found
          if [ -n "$DEB_PATH" ]; then
            DEB_STANDARDIZED="./dictaclerk.deb"
            cp "$DEB_PATH" "$DEB_STANDARDIZED"
            echo "deb_path=$DEB_STANDARDIZED" >> $GITHUB_OUTPUT
            echo "deb_name=dictaclerk.deb" >> $GITHUB_OUTPUT
          fi

          # Copy RPM package if found
          if [ -n "$RPM_PATH" ]; then
            RPM_STANDARDIZED="./dictaclerk.rpm"
            cp "$RPM_PATH" "$RPM_STANDARDIZED"
            echo "rpm_path=$RPM_STANDARDIZED" >> $GITHUB_OUTPUT
            echo "rpm_name=dictaclerk.rpm" >> $GITHUB_OUTPUT
          fi

          echo "appimage_path=$APPIMAGE_STANDARDIZED" >> $GITHUB_OUTPUT
          echo "appimage_name=dictaclerk.appimage" >> $GITHUB_OUTPUT
          echo "Packages prepared for release"

      - name: Sign packages
        env:
          GPG_PRIVATE_KEY_PASSWORD: ${{ secrets.GPG_PRIVATE_KEY_PASSWORD }}
        run: |
          # Function to sign a file
          sign_file() {
            local file_path="$1"
            echo "Signing: $file_path"

            if [ -n "$GPG_PRIVATE_KEY_PASSWORD" ]; then
              echo "$GPG_PRIVATE_KEY_PASSWORD" | gpg --batch --yes --passphrase-fd 0 --armor --detach-sign "$file_path"
            else
              gpg --batch --yes --armor --detach-sign "$file_path"
            fi

            # Verify the signature was created
            if [ -f "$file_path.asc" ]; then
              echo "GPG signature created for: $file_path"
              gpg --verify "$file_path.asc" "$file_path"
            else
              echo "Error: GPG signature file not created for: $file_path"
              exit 1
            fi
          }

          # Sign AppImage
          sign_file "${{ steps.packages.outputs.appimage_path }}"

          # Sign DEB package if it exists
          if [ -n "${{ steps.packages.outputs.deb_path }}" ]; then
            sign_file "${{ steps.packages.outputs.deb_path }}"
          fi

          # Sign RPM package if it exists
          if [ -n "${{ steps.packages.outputs.rpm_path }}" ]; then
            sign_file "${{ steps.packages.outputs.rpm_path }}"
          fi

          echo "All available packages signed successfully"

      - name: Generate checksums
        id: checksums
        run: |
          # Generate SHA256 checksums for all packages
          CHECKSUM_FILE="./dictaclerk-checksums.sha256"

          # AppImage checksums
          sha256sum "${{ steps.packages.outputs.appimage_path }}" > "$CHECKSUM_FILE"
          sha256sum "${{ steps.packages.outputs.appimage_path }}.asc" >> "$CHECKSUM_FILE"

          # DEB package checksums if it exists
          if [ -n "${{ steps.packages.outputs.deb_path }}" ]; then
            sha256sum "${{ steps.packages.outputs.deb_path }}" >> "$CHECKSUM_FILE"
            sha256sum "${{ steps.packages.outputs.deb_path }}.asc" >> "$CHECKSUM_FILE"
          fi

          # RPM package checksums if it exists
          if [ -n "${{ steps.packages.outputs.rpm_path }}" ]; then
            sha256sum "${{ steps.packages.outputs.rpm_path }}" >> "$CHECKSUM_FILE"
            sha256sum "${{ steps.packages.outputs.rpm_path }}.asc" >> "$CHECKSUM_FILE"
          fi

          # Display checksums
          echo "Generated checksums:"
          cat "$CHECKSUM_FILE"

          echo "checksum_file=$CHECKSUM_FILE" >> $GITHUB_OUTPUT

      - name: Generate release notes
        id: release_notes
        run: |
          cat > release_notes.md << 'EOF'
          # DictaClerk ${{ steps.version.outputs.tag }}

          ## Downloads

          ### AppImage (Universal Linux)
          - **AppImage**: [dictaclerk.appimage](https://github.com/lsmod/DictaClerk/releases/download/${{ steps.version.outputs.tag }}/dictaclerk.appimage)
          - **GPG Signature**: [dictaclerk.appimage.asc](https://github.com/lsmod/DictaClerk/releases/download/${{ steps.version.outputs.tag }}/dictaclerk.appimage.asc)

          ### Debian/Ubuntu Package
          - **DEB Package**: [dictaclerk.deb](https://github.com/lsmod/DictaClerk/releases/download/${{ steps.version.outputs.tag }}/dictaclerk.deb)
          - **GPG Signature**: [dictaclerk.deb.asc](https://github.com/lsmod/DictaClerk/releases/download/${{ steps.version.outputs.tag }}/dictaclerk.deb.asc)

          ### RPM Package (Red Hat/Fedora/SUSE)
          - **RPM Package**: [dictaclerk.rpm](https://github.com/lsmod/DictaClerk/releases/download/${{ steps.version.outputs.tag }}/dictaclerk.rpm)
          - **GPG Signature**: [dictaclerk.rpm.asc](https://github.com/lsmod/DictaClerk/releases/download/${{ steps.version.outputs.tag }}/dictaclerk.rpm.asc)

          ### Verification Files
          - **Checksums**: [dictaclerk-checksums.sha256](https://github.com/lsmod/DictaClerk/releases/download/${{ steps.version.outputs.tag }}/dictaclerk-checksums.sha256)
          - **Public Key**: [dictaclerk-signing-key.asc](https://github.com/lsmod/DictaClerk/releases/download/${{ steps.version.outputs.tag }}/dictaclerk-signing-key.asc)

          ## Verification

          ### GPG Signature Verification
          To verify the GPG signature:
          \`\`\`bash
          # Download the public key (first time only)
          curl -L https://github.com/lsmod/DictaClerk/releases/download/${{ steps.version.outputs.tag }}/dictaclerk-signing-key.asc | gpg --import

          # Verify the signature
          gpg --verify dictaclerk.appimage.asc dictaclerk.appimage
          \`\`\`

          ### Checksum Verification
          To verify file integrity:
          \`\`\`bash
          sha256sum -c dictaclerk-checksums.sha256
          \`\`\`

          ## Installation

          ### AppImage (Universal Linux)
          1. Download the AppImage
          2. Make it executable: \`chmod +x dictaclerk.appimage\`
          3. Run: \`./dictaclerk.appimage\`

          ### Debian/Ubuntu (.deb)
          \`\`\`bash
          # Download and install
          sudo dpkg -i dictaclerk.deb

          # If dependencies are missing, run:
          sudo apt-get install -f
          \`\`\`

          ### Red Hat/Fedora/SUSE (.rpm)
          \`\`\`bash
          # For RPM-based systems (Fedora, RHEL, CentOS, openSUSE)
          sudo rpm -i dictaclerk.rpm

          # Or using dnf (Fedora):
          sudo dnf install dictaclerk.rpm

          # Or using zypper (openSUSE):
          sudo zypper install dictaclerk.rpm
          \`\`\`

          ## What's New

          Release ${{ steps.version.outputs.version }} includes various improvements and bug fixes.

          ---

          **Build Information:**
          - Build Date: $(date -u +'%Y-%m-%d %H:%M:%S UTC')
          - Commit: ${{ github.sha }}
          - Rust Version: ${{ env.RUST_VERSION }}
          - Node Version: ${{ env.NODE_VERSION }}
          EOF

      - name: Export GPG public key
        run: |
          # Export the public key for users
          gpg --armor --export ${{ steps.gpg.outputs.key_id }} > dictaclerk-signing-key.asc
          echo "Public key exported for distribution"

      - name: Create GitHub Release
        uses: ncipollo/release-action@v1
        with:
          tag: ${{ steps.version.outputs.tag }}
          name: 'DictaClerk ${{ steps.version.outputs.tag }}'
          bodyFile: release_notes.md
          draft: false
          prerelease: false
          artifacts: |
            ${{ steps.packages.outputs.appimage_path }}
            ${{ steps.packages.outputs.appimage_path }}.asc
            ${{ steps.packages.outputs.deb_path }}
            ${{ steps.packages.outputs.deb_path }}.asc
            ${{ steps.packages.outputs.rpm_path }}
            ${{ steps.packages.outputs.rpm_path }}.asc
            ${{ steps.checksums.outputs.checksum_file }}
            dictaclerk-signing-key.asc
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify packages and signatures
        run: |
          echo "=== Final Verification ==="

          # Test AppImage is executable
          file "${{ steps.packages.outputs.appimage_path }}"

          # Verify all GPG signatures
          echo "Verifying AppImage signature..."
          gpg --verify "${{ steps.packages.outputs.appimage_path }}.asc" "${{ steps.packages.outputs.appimage_path }}"

          if [ -n "${{ steps.packages.outputs.deb_path }}" ]; then
            echo "Verifying DEB package signature..."
            gpg --verify "${{ steps.packages.outputs.deb_path }}.asc" "${{ steps.packages.outputs.deb_path }}"
          fi

          if [ -n "${{ steps.packages.outputs.rpm_path }}" ]; then
            echo "Verifying RPM package signature..."
            gpg --verify "${{ steps.packages.outputs.rpm_path }}.asc" "${{ steps.packages.outputs.rpm_path }}"
          fi

          # Verify checksums
          echo "Verifying checksums..."
          sha256sum -c "${{ steps.checksums.outputs.checksum_file }}"

          echo "=== All verifications passed! ==="
